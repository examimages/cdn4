<svg width="112" height="165" version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Top Labels -->
  <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">16</text>
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">P</text>

  <text x="450" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">22</text>
  <text x="450" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">V</text>

  <!-- Bottom Labels -->
  <text x="150" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">X</text>
  <text x="150" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">24</text>

  <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">R</text>
  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="48px" fill="#000000">18</text>

  <!-- Connection Lines with Arrows -->
  <line x1="170" y1="190" x2="430" y2="410" stroke="#000000" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="430" y1="190" x2="170" y2="410" stroke="#000000" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Operator Label -->
  <text x="350" y="315" text-anchor="start" font-family="Arial, sans-serif" font-size="48px" fill="#000000">+2</text>
</svg>